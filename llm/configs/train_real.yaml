# MOM Real Training Config — CPU, tiny model, binary-packed data
# Uses pre-tokenized binary format for 4.7× more samples (141 vs 30).

model:
  preset: tiny             # 256D, 6L, 8H — ~12M params
  max_seq_len: 256
  use_flash_attention: false
  use_bitnet: false
  use_triton_kernels: false
  gradient_checkpointing: false
  dropout: 0.1
  attention_dropout: 0.1
  embed_dropout: 0.1

training:
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0

  batch_size: 4                   # 4 samples per mini-batch
  gradient_accumulation_steps: 2  # effective batch = 8
  num_epochs: 200                 # 200 epochs × 17 steps/epoch = ~3400 steps
  max_steps: 3000
  warmup_steps: 100
  lr_schedule: wsd

  dtype: float32
  use_amp: false

  label_smoothing: 0.1            # prevent overconfident predictions
  early_stopping_patience: 5      # stop if eval loss doesn't improve for 5 evals

  checkpoint_dir: ./output/checkpoints/mom-real
  save_every_steps: 200
  eval_every_steps: 100
  log_every_steps: 50

data:
  train_path: ./output/data/ml_knowledge_train.bin
  eval_path: ./output/data/ml_knowledge_eval.bin
  num_workers: 0
