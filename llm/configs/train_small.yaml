# MOM Training Config - Small Model (~125M params)
# Good starting point for single GPU training

model:
  preset: small          # 768D, 12L, 12H
  vocab_size: 32000
  max_seq_len: 2048
  use_flash_attention: true
  gradient_checkpointing: false

training:
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0

  batch_size: 16
  gradient_accumulation_steps: 2
  num_epochs: 3
  warmup_steps: 1000
  lr_schedule: cosine

  dtype: bfloat16
  use_amp: true

  checkpoint_dir: ./checkpoints/mom-small
  save_every_steps: 2000
  eval_every_steps: 500
  log_every_steps: 10

data:
  train_path: ./data/ml_knowledge.jsonl
  eval_path: ./data/ml_knowledge_eval.jsonl
  max_seq_len: 2048
  num_workers: 4
