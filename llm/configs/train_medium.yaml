# MOM Training Config - Medium Model (~350M params)
# With BitNet 1.58-bit: fits on single GPU (8GB+ VRAM)
# ~10x compression: 350M params → ~85MB instead of ~700MB

model:
  preset: medium         # 1024D, 24L, 16H
  vocab_size: 32000
  max_seq_len: 4096
  use_flash_attention: true
  use_bitnet: true       # 1.58-bit ternary weights {-1, 0, +1}
  gradient_checkpointing: true

training:
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0

  batch_size: 8
  gradient_accumulation_steps: 8
  num_epochs: 3
  warmup_steps: 2000
  lr_schedule: cosine

  dtype: bfloat16
  use_amp: true
  distributed: false

  checkpoint_dir: ./checkpoints/mom-medium
  save_every_steps: 1000
  eval_every_steps: 500
  log_every_steps: 10

  wandb_project: mom
  wandb_run_name: medium-v1

data:
  train_path: ./data/ml_knowledge.jsonl
  eval_path: ./data/ml_knowledge_eval.jsonl
  max_seq_len: 4096
  num_workers: 4
