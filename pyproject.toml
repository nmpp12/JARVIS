[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mom-llm"
version = "0.2.0"
description = "MOM — Master of Models"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "flask",
    "pyyaml",
]

[project.optional-dependencies]
train = ["wandb", "datasets"]
gui = ["gradio"]

[tool.setuptools.packages.find]
include = ["llm*"]
